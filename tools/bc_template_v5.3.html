@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');

/* ── 테마 토큰: 다크(기본) / 라이트(html|body.light-theme) ── */
#bcApp{

  --bc-acc:#b79cff; --bc-acc2:#8b5cf6; --bc-tint:rgba(139,92,246,.07);
  color:var(--bc-text) !important;
}
html.light-theme #bcApp, body.light-theme #bcApp{
  --bc-bg:#f6f5fb; --bc-text:#1a1830; --bc-sub:#5b5775; --bc-mute:#8d89a3;
  --bc-line:rgba(26,24,48,.10); --bc-line2:rgba(26,24,48,.22);
  --bc-acc:#6d3df0; --bc-acc2:#6d3df0; --bc-tint:rgba(109,61,240,.06);
}
.bcWrap{background:transparent !important}   /* v3.3: 사이트 공통 배경 사용 */

html.light-theme #bcApp .bcLogo img.bcMono, body.light-theme #bcApp .bcLogo img.bcMono{filter:brightness(0);opacity:.82}   /* 컬러본 없는 로고만 반전 */

.bcWrap{

  letter-spacing:-.01em; -webkit-font-smoothing:antialiased; line-height:1.5;
  padding:40px 20px 96px !important; box-sizing:border-box;
}

#bcApp .bcH1 .bcHt{display:inline-block;background:linear-gradient(120deg,#ffffff 0%,#d9ccff 55%,#b79cff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent !important;padding-right:.05em}
html.light-theme #bcApp .bcH1 .bcHt, body.light-theme #bcApp .bcH1 .bcHt{background:linear-gradient(120deg,#2a1878 0%,#5b2fd6 60%,#7c3aed 100%);-webkit-background-clip:text;background-clip:text}

#bcApp .bcTop b{color:var(--bc-text) !important;font-weight:600 !important}

    var cells=root.querySelectorAll('.bcTbl td,.bcTbl th');
    for(var i=0;i<cells.length;i++){
      var el=cells[i], cs=+el.getAttribute('data-cs'), ce=+el.getAttribute('data-ce'), ri=+el.getAttribute('data-ri');
      var inSel = cs>=sel.s && cs<=sel.e;
      el.classList.toggle('bcSel',inSel); el.classList.toggle('bcSelS',inSel&&cs===sel.s); el.classList.toggle('bcSelE',inSel&&ce===sel.e);
      if(inSel) el.style.setProperty('--bcA',selAlpha(ri,n)); else el.style.removeProperty('--bcA');
    }
    var p=c.products[st.prod]||c.products[0], lg=document.getElementById('bcDLogo'), tt=document.getElementById('bcDTitle');
    if(lg) lg.innerHTML=logo(p.insurer); if(tt) tt.textContent=p.name;
  }
  function colRanges(tbl){ var head=tbl.rows[0]||[], r=[]; head.forEach(function(cell,i){ if(i===0) return; r.push({s:cell.c, e:cell.c+(cell.w||1)-1}); }); return {ranges:r, firstProd:r.length?r[0].s:1}; }
  function tableHtml(c){
    var tbl=c.table; if(!tbl) return '<p class="bcMuted">비교표가 없습니다.</p>';
    var cr=colRanges(tbl), best=cr.ranges[0], sel=cr.ranges[st.prod]||best, h='<div class="bcTblWrap"><table class="bcTbl">';
    tbl.rows.forEach(function(row,ri){
      var isHead=ri===0, isName=/^상품명/.test((row[0]||{}).t||'');
      h+='<tr>';
      row.forEach(function(cell,i){
        var cls=[], tag=isHead?'th':'td';
        var inBest=best&&cell.c>=best.s&&cell.c<=best.e, inSel=sel&&cell.c>=sel.s&&cell.c<=sel.e;
        if(!isHead && cell.c<cr.firstProd){ cls.push('bcLab'); if(cell.c>0) cls.push('bcL2'); }
        if(cell.c>=cr.firstProd) cls.push('bcCol');   /* v4.1: 클릭 가능 열 */
        if(inBest) cls.push('bcBestCol');
        if(inSel){ cls.push('bcSel'); if(cell.c===sel.s) cls.push('bcSelS'); if(cell.c+(cell.w||1)-1===sel.e) cls.push('bcSelE'); }
        if(isName && cell.c>=cr.firstProd) cls.push('bcName');
        if(!isHead && cell.c>=cr.firstProd && /^[\d,.]+$/.test(cell.t.trim())) cls.push('bcNum');
        var txt=br(cell.t);
        if(isHead && i>0){ var pi=i-1, p=c.products[pi]||{}, nm=cell.t||p.insurer;
          txt = pi===0 ? '<div class="bcTh"><button data-reason="1"><small class="bcGold">Best Choice</small>'+logo(nm)+'</button></div>'
                       : '<div class="bcTh"><button data-sel="'+pi+'">'+logo(nm)+'</button></div>'; }
        var a=selAlpha(ri,tbl.rows.length);
        var attrs=(cell.w>1?' colspan="'+cell.w+'"':'')+(cell.h>1?' rowspan="'+cell.h+'"':'')+(cls.length?' class="'+cls.join(' ')+'"':'')
          +' data-cs="'+cell.c+'" data-ce="'+(cell.c+(cell.w||1)-1)+'" data-ri="'+ri+'"'+(inSel?' style="--bcA:'+a+'"':'');
        h+='<'+tag+attrs+'>'+txt+'</'+tag+'>';
      });
      h+='</tr>';
    });
    h+='</table></div><div class="bcScrollHint">표를 좌우로 밀어 전체 내용을 확인하세요.</div>';
    var ns=notes(c);
    h+='<div class="bcNotes"><span><i></i>선택한 상품 (로고를 누르면 해당 상품 기준으로 강조, BEST 로고는 선정 이유)</span><span>보험료 단위: 원 / 월납</span>'+(ns.length?'<span>기준: '+esc(ns.join(' · '))+'</span>':'')+'</div>';
    return h;
  }

  /* ── 선정 이유 ── */
  function reasonHtml(c){
    var d=c.detail||{}, feat=(d.feature||[]).slice(), age='';
    feat=feat.filter(function(t){ var m=t.match(/가입\s*연령\s*[–\-:：]?\s*(.+)$/); if(m&&!age){ age=m[1].trim(); return false;} return true; });
    var h='<div class="bcChips">'+(age?'<span>가입 연령 <b>'+esc(age)+'</b></span>':'')+'<span>분야 <b>'+esc(c.name)+'</b></span><span>비교 대상 '+c.products.slice(1).map(function(p){return logo(p.insurer);}).join('')+'</span></div>';
    h+='<div class="bcRs">';
    var n=1;
    function row(cls,title,body){ h+='<div class="bcR bcAni '+cls+'" style="--d:'+(0.1+n*0.08).toFixed(2)+'s"><div class="bcNo">'+pad(n++)+'</div><div class="bcT">'+title+'</div><div class="bcB">'+body+'</div></div>'; }
    if(feat.length) row('', '상품 특징', '<ul>'+feat.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>');
    if(d.reason&&d.reason.length) row('bcKey', '선정 이유', '<ul>'+d.reason.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>');
    if(d.sales&&d.sales.length) row('', '세일즈 포인트', d.sales.map(function(t){return '<p>'+esc(t)+'</p>';}).join(''));
    h+='</div>';
    return h;
  }

  /* ── 상세 ── */
  function renderDetail(){
    var s=sec(), c=cat(), isR=st.view==='reason', p=c.products[isR?0:st.prod]||c.products[0], ns=notes(c), h='';
    h+='<div class="bcTop"><div><a data-go="list">베스트 초이스</a><i>›</i><a data-go="list">'+esc(s.name)+'</a><i>›</i>'+(isR?'<a data-view="table">'+esc(c.name)+'</a><i>›</i><b>선정 이유</b>':'<b>'+esc(c.name)+'</b>')+'</div><button data-go="list">← 목록으로</button></div>';
    h+='<div class="bcDHead bcAni"><div><p class="bcEyebrow">'+esc(s.name)+' · '+esc(c.name)+(isR?' · 선정 이유':' · 타사 비교표')+'</p>'+'<span id="bcDLogo">'+logo(p.insurer)+'</span><h2 class="bcH1"><span class="bcHt" id="bcDTitle">'+esc(p.name)+'</span>'+(ns.length?'<small>'+esc(ns.join(' · '))+'</small>':'')+'</h2></div>'
      +'<div class="bcViews"><button data-view="table" class="'+(isR?'':'bcOn')+'">타사 비교표</button><button data-view="reason" class="'+(isR?'bcOn':'')+'">선정 이유</button></div></div>';
    h+='<div class="bcAni" style="--d:.12s">'+(isR ? reasonHtml(c) : tableHtml(c))+'</div>';
    h+='<div class="bcOther"><span>'+esc(s.name)+' 다른 분야</span>'; s.categories.forEach(function(x,i){ h+='<button data-cat="'+i+'" class="'+(i===st.cat?'bcOn':'')+'">'+esc(x.name)+'</button>'; }); h+='</div>';
    h+='<div class="bcDisc"><p>'+FOOT1+'</p><p>'+FOOT2+'</p></div>';
    h+='<div class="bcNav"><button data-go="list">← '+esc(s.name)+' 목록</button>'+(isR?'<button data-view="table">타사 비교표 보기</button>':'<button class="bcPri" data-view="reason">선정 이유 · 세일즈 포인트 →</button>')+'</div>';
    root.innerHTML=h;
  }

  function render(scroll){
    if(st.view==='list') renderList(); else renderDetail();
    if(scroll){ var y=root.getBoundingClientRect().top+window.pageYOffset-100; window.scrollTo({top:Math.max(0,y),behavior:'smooth'}); }
  }
  root.addEventListener('click',function(e){
    var b;
    if((b=e.target.closest('[data-sec]'))){ st.sec=+b.getAttribute('data-sec'); st.view='list'; render(false); return; }
    if((b=e.target.closest('[data-open]'))){ var a=b.getAttribute('data-open').split(':'); st.cat=+a[0]; st.prod=+a[1]; st.view='table'; render(true); return; }
    if((b=e.target.closest('[data-reason]'))){ st.view='reason'; render(true); return; }
    if((b=e.target.closest('[data-sel]'))){ st.prod=+b.getAttribute('data-sel'); applySel(); return; }
    if((b=e.target.closest('.bcTbl .bcCol'))){ /* v4.1: 열 아무 셀 클릭 → 해당 상품 선택 */
      var c=cat(); if(!c.table) return; var cr=colRanges(c.table), cs=+b.getAttribute('data-cs');
      for(var i=0;i<cr.ranges.length;i++){ if(cs>=cr.ranges[i].s && cs<=cr.ranges[i].e){ if(i!==st.prod){ st.prod=i; applySel(); } return; } }
      return;
    }
    if((b=e.target.closest('[data-view]'))){ st.view=b.getAttribute('data-view'); render(true); return; }
    if((b=e.target.closest('[data-cat]'))){ st.cat=+b.getAttribute('data-cat'); st.prod=0; if(st.view==='list') st.view='table'; render(true); return; }
    if((b=e.target.closest('[data-go]'))){ st.view='list'; st.prod=0; render(true); return; }
  });
  render(false);
}
</script>
